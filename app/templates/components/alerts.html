<!-- Custom Modern Glassmorphic Toast Notification System -->
<style>
    /* Container Toast di Pojok Kanan Atas */
    #toastContainerCustom {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
        width: calc(100% - 48px);
        pointer-events: none;
    }

    /* Kartu Toast Modern */
    .toast-card-modern {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 16px 18px;
        color: #ffffff;
        box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: flex-start;
        gap: 14px;
        position: relative;
        overflow: hidden;
        transform: translateX(120%);
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .toast-card-modern.show {
        transform: translateX(0);
        opacity: 1;
    }

    .toast-card-modern.hide {
        transform: translateX(120%);
        opacity: 0;
    }

    /* Icon Badge Wrapper */
    .toast-icon-box {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    /* Variasi Warna Status */
    .toast-card-modern.success .toast-icon-box {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .toast-card-modern.danger .toast-icon-box,
    .toast-card-modern.error .toast-icon-box {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }
    .toast-card-modern.warning .toast-icon-box {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }
    .toast-card-modern.info .toast-icon-box {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    /* Content Teks */
    .toast-content-box {
        flex-grow: 1;
        padding-right: 18px;
    }
    .toast-title-text {
        font-weight: 700;
        font-size: 0.92rem;
        letter-spacing: -0.2px;
        margin-bottom: 2px;
        color: #f8fafc;
    }
    .toast-message-text {
        font-size: 0.82rem;
        color: #94a3b8;
        line-height: 1.45;
    }

    /* Tombol Close x */
    .toast-close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        background: transparent;
        border: none;
        color: #64748b;
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
        border-radius: 6px;
        transition: all 0.2s ease;
    }
    .toast-close-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
    }

    /* Dynamic Progress Bar */
    .toast-progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 100%;
        transform-origin: left;
    }
    .toast-card-modern.success .toast-progress-bar { background: #10b981; }
    .toast-card-modern.danger .toast-progress-bar,
    .toast-card-modern.error .toast-progress-bar { background: #f43f5e; }
    .toast-card-modern.warning .toast-progress-bar { background: #f59e0b; }
    .toast-card-modern.info .toast-progress-bar { background: #3b82f6; }

    @keyframes toastProgressAnim {
        from { transform: scaleX(1); }
        to { transform: scaleX(0); }
    }
</style>

<!-- Container Penampung Toast -->
<div id="toastContainerCustom"></div>

<script>
    // Fungsi Utama Memunculkan Custom Toast
    function showCustomToast(type, title, message, duration = 4500) {
        const container = document.getElementById('toastContainerCustom');
        if (!container) return;

        // Pemilihan Ikon Bootstrap
        let iconClass = 'bi-info-circle-fill';
        if (type === 'success') iconClass = 'bi-check-circle-fill';
        else if (type === 'danger' || type === 'error') iconClass = 'bi-exclamation-triangle-fill';
        else if (type === 'warning') iconClass = 'bi-exclamation-circle-fill';

        // Elemen Toast
        const toast = document.createElement('div');
        toast.className = `toast-card-modern ${type}`;

        toast.innerHTML = `
            <div class="toast-icon-box">
                <i class="bi ${iconClass}"></i>
            </div>
            <div class="toast-content-box">
                <div class="toast-title-text">${title}</div>
                <div class="toast-message-text">${message}</div>
            </div>
            <button type="button" class="toast-close-btn" onclick="dismissCustomToast(this.parentElement)">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="toast-progress-bar" style="animation: toastProgressAnim ${duration}ms linear forwards;"></div>
        `;

        container.appendChild(toast);

        // Slide in
        setTimeout(() => toast.classList.add('show'), 50);

        // Auto dismiss setelah durasi selesai
        const timer = setTimeout(() => {
            dismissCustomToast(toast);
        }, duration);

        // Pause progress & timer saat di-hover mouse
        toast.addEventListener('mouseenter', () => {
            const pb = toast.querySelector('.toast-progress-bar');
            if (pb) pb.style.animationPlayState = 'paused';
            clearTimeout(timer);
        });

        toast.addEventListener('mouseleave', () => {
            dismissCustomToast(toast);
        });
    }

    function dismissCustomToast(toastEl) {
        if (!toastEl || toastEl.classList.contains('hide')) return;
        toastEl.classList.remove('show');
        toastEl.classList.add('hide');
        setTimeout(() => {
            if (toastEl.parentElement) toastEl.parentElement.removeChild(toastEl);
        }, 400);
    }

    // Eksekusi Pesan Flash dari Flask Backend
    document.addEventListener("DOMContentLoaded", function () {
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    (function() {
                        const cat = '{{ category }}';
                        let title = 'Informasi Sistem';
                        if (cat === 'success') title = 'Berhasil!';
                        else if (cat === 'danger' || cat === 'error') title = 'Terjadi Kesalahan!';
                        else if (cat === 'warning') title = 'Peringatan!';

                        // Beri jeda sedikit jika ada multiple messages
                        setTimeout(() => {
                            showCustomToast(cat, title, '{{ message|safe }}');
                        }, {{ loop.index0 * 250 }});
                    })();
                {% endfor %}
            {% endif %}
        {% endwith %}
    });
</script>
